<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Min bokhylle</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header><div class="brand"><span class="logo">▤</span><div><h1>Min bokhylle</h1><small>Privat boksamling</small></div></div><button id="syncAll">Oppdater alle</button></header>
<main><aside><div class="panel"><h2>Forfattere</h2><div id="authors"></div><form id="addAuthor" class="addAuthor"><input id="newAuthorName" placeholder="Ny forfatter ..." autocomplete="off"><button type="submit">Legg til</button></form></div><div class="stats"><small>TOTALT</small><strong id="stats">0 av 0 lest</strong></div><div class="panel logPanel"><h2>Synk-logg</h2><div id="syncLog"></div></div></aside>
<section><div id="notice" class="notice">Velg en forfatter og hent de norske bøkene fra Nasjonalbiblioteket.</div><div class="toolbar"><div><small>BIBLIOTEK</small><h2 id="authorName">Velg forfatter</h2></div><button id="syncAuthor">Hent norske bøker</button></div><div class="filters"><input id="search" placeholder="Søk i bøkene ..."><label class="showHidden"><input type="checkbox" id="showHidden"> Vis skjulte</label></div><div id="books" class="books"></div></section></main>
<dialog id="editDialog"><form method="dialog" id="editForm"><h3>Rediger bok</h3>
<label>Tittel<input id="editTitle" required></label>
<label>Utgitt<input id="editYear" type="number" min="0" max="3000"></label>
<label>Serie<input id="editSeries" list="seriesList" placeholder="Ikke plassert i serie"></label>
<label>Nummer i serien<input id="editOrder" type="number" step="0.1" min="0"></label>
<datalist id="seriesList"></datalist>
<p class="hint">Endrer du tittel eller årstall, beholdes endringen også når boklisten oppdateres.</p>
<div class="dialogActions"><button type="button" id="editHide" class="secondary">Skjul bok</button><span></span><button type="button" id="editCancel" class="secondary">Avbryt</button><button type="submit">Lagre</button></div>
</form></dialog>
<script src="/assets/app.js"></script></body></html>
